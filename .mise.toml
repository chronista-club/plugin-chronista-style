# 検証環境は mise で宣言する（グローバル mise はタスクランナー専用。ランタイムは repo ごとにここで）
# 初回: mise trust && mise install
[tools]
python = "3.12"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.deps]
description = "検証用の Python 依存（PyYAML）を入れる"
run = "python -m pip install -q -r requirements-dev.txt"

[tasks.validate]
description = "manifest・スキル・hook パス・ローカル参照の整合性"
depends = ["deps"]
run = "python scripts/validate.py"

[tasks.test]
description = "hook と branch-step と配布の回帰テスト"
depends = ["deps"]
run = "python -m unittest discover -s tests -v"

[tasks.lint]
description = "シェルスクリプトの構文（hooks・bin・各スキルの scripts / hooks）"
shell = "bash -c"
# bash -n は最初の引数しか検査しないので、1 ファイルずつ回す
run = """
shopt -s nullglob
rc=0
for f in hooks/*.sh bin/setup bin/setup-windows skills/*/scripts/* skills/*/hooks/*; do
  bash -n "$f" || rc=1
done
exit $rc
"""

[tasks.sync-check]
description = "Claude / Codex manifest の共有 metadata が一致しているか"
run = "python scripts/sync-manifests.py --check"

[tasks.check]
description = "validate + test + lint + sync-check（PR 前・branch-step の門に使う）"
depends = ["validate", "test", "lint", "sync-check"]

[tasks.package]
description = "配布 ZIP を dist/ に作る"
depends = ["validate"]
run = "python scripts/package.py"
